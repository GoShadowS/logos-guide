<title>Главная и поиск помещения</title><desc>Схема экрана Главная по Compose-структуре: строка поиска, действия открыть карту и выбрать маршрутное назначение. Не скриншот запущенного приложения.</desc><rect width="980" height="1380" fill="#F3F6FB"/>
