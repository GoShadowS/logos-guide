<title>Результат поиска помещения без настроенного маршрута</title><desc>Схема обычного поиска комнаты 233. Каталог показывает, что её контур и вход не подтверждены; действие построить маршрут отсутствует. Это не подтверждает отсутствие комнаты в здании. Не скриншот.</desc><rect width="980" height="1380" fill="#F3F6FB"/>
