name: Signed Android release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up JDK 25
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
      - name: Install Android SDK 37
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Prepare release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "Configure the Android release signing secrets before publishing a tagged release." >&2
            exit 1
          fi
          keystore="$RUNNER_TEMP/logos-guide-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          {
            echo "ANDROID_RELEASE_STORE_FILE=$keystore"
            echo "ANDROID_RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "ANDROID_RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Build signed release APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - name: Validate APK and generate subject hash
        id: hash
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          apk="app/build/outputs/apk/release/logos-guide-${version}.apk"
          test -f "$apk"
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$apk" | grep -F "versionName='${version}'"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify "$apk"
          echo "hashes=$(sha256sum "$apk" | base64 -w0)" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          apk="app/build/outputs/apk/release/logos-guide-${version}.apk"
          gh release create "$GITHUB_REF_NAME" "$apk" \
            --title "ЛОГОС: Путеводитель ${version}" \
            --generate-notes \
            --latest

  provenance:
    needs: [release]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.release.outputs.hashes }}
      upload-assets: true
