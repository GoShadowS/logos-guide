name: Indoor data validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m compileall -q tools
      - name: Validate indoor data and SVG geometry
        run: |
          python3 tools/validate_indoor_data.py
          python3 tools/extract_svg_geometry.py app/src/main/assets/floors/floor_1.svg --strict
          python3 tools/extract_svg_geometry.py app/src/main/assets/floors/floor_2.svg --strict
