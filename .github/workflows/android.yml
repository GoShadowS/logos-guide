name: Android build and unit tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up JDK 25
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
      - name: Install Android SDK 37
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Run unit tests and verify the release APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          apk="app/build/outputs/apk/release/logos-guide-1.1.0-release.apk"
          test -f "$apk"
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$apk" | grep -F "versionName='1.1.0-release'"
      - name: Verify OpenDoors is disabled in every generated variant
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          root = Path("app/build/generated/source/buildConfig")
          configs = sorted(root.glob("**/com/logos/navigator/BuildConfig.java"))
          if not configs:
              raise SystemExit(f"No generated BuildConfig files found under {root}")

          variants = set()
          for config in configs:
              variant = config.relative_to(root).parts[0]
              variants.add(variant)
              match = re.search(r"\bOPEN_DOORS\s*=\s*(true|false)\s*;", config.read_text())
              if match is None:
                  raise SystemExit(f"OPEN_DOORS is missing from {config}")
              if match.group(1) != "false":
                  raise SystemExit(f"OPEN_DOORS must be false in {variant}: {config}")

          missing = {"debug", "release"} - variants
          if missing:
              raise SystemExit(f"Expected Debug and Release BuildConfig files; missing {sorted(missing)}")
          print(f"OPEN_DOORS=false in all {len(configs)} generated variants: {', '.join(sorted(variants))}")
          PY
      - name: Summarize Gradle failure
        if: failure()
        shell: bash
        run: |
          if [[ ! -s "$RUNNER_TEMP/gradle.log" ]]; then
            exit 0
          fi

          report=$(grep -E 'FAILURE:|What went wrong:|Try:|Execution failed for task|FAILED|e: |Exception:|error:' "$RUNNER_TEMP/gradle.log" | tail -n 30 || true)
          if [[ -z "$report" ]]; then
            report=$(tail -n 30 "$RUNNER_TEMP/gradle.log")
          fi

          echo "## Gradle failure details" >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r line; do
            echo "$line" >> "$GITHUB_STEP_SUMMARY"
            safe=${line//%/%25}
            echo "::error title=Gradle failure::$safe"
          done <<< "$report"
