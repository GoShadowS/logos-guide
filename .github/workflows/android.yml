name: Android build and unit tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up JDK 25
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
      - name: Install Android SDK 37
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Run unit tests and assemble debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug 2>&1 | tee "$RUNNER_TEMP/gradle.log"
      - name: Summarize Gradle failure
        if: failure()
        shell: bash
        run: |
          if [[ ! -s "$RUNNER_TEMP/gradle.log" ]]; then
            exit 0
          fi

          report=$(grep -E 'FAILURE:|What went wrong:|Try:|Execution failed for task|FAILED|e: |Exception:|error:' "$RUNNER_TEMP/gradle.log" | tail -n 30 || true)
          if [[ -z "$report" ]]; then
            report=$(tail -n 30 "$RUNNER_TEMP/gradle.log")
          fi

          echo "## Gradle failure details" >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r line; do
            echo "$line" >> "$GITHUB_STEP_SUMMARY"
            safe=${line//%/%25}
            echo "::error title=Gradle failure::$safe"
          done <<< "$report"
