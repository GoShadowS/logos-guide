name: EAS Build

# ============================================================================
#  Автоматическая сборка приложения «ЛОГОС: Путеводитель».
#  Как настроить (по шагам) — см. BUILD.md, раздел 6.
#
#  1. Создайте токен: https://expo.dev/settings/access-tokens
#  2. Добавьте его в Secrets репозитория под именем EXPO_TOKEN
#  3. При каждом push в main соберётся тестовый APK
#     При создании тега v1.0.0 соберётся production-бандл для Google Play
# ============================================================================

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: 'Платформа для сборки'
        required: true
        default: 'android'
        type: choice
        options: [android, ios, all]

jobs:
  # ---------------------------------------------------------------------------
  # 1. Проверка данных и алгоритмов перед сборкой (быстро, без облака Expo)
  # ---------------------------------------------------------------------------
  validate:
    name: Проверка данных и тесты
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: logos-guide
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Установка зависимостей
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Валидация JSON-данных
        run: node tools/validate-data.js

      - name: Тесты навигации и поиска
        run: node tools/test-nav.js

  # ---------------------------------------------------------------------------
  # 2. Тестовый APK для Android — при каждом push в main
  # ---------------------------------------------------------------------------
  build-android-preview:
    name: Android APK (preview)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Установка зависимостей
        working-directory: logos-guide
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Установка EAS CLI
        run: npm install -g eas-cli

      - name: Сборка APK (облако Expo)
        working-directory: logos-guide
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --non-interactive

      - name: Ссылка на скачивание
        run: |
          echo "### Готовый APK доступен на https://expo.dev → Builds" >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # 3. Тестовый IPA для iOS — при теге v* или ручном запуске
  # ---------------------------------------------------------------------------
  build-ios-preview:
    name: iOS IPA (preview)
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v') || inputs.platform == 'ios' || inputs.platform == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Установка зависимостей
        working-directory: logos-guide
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Установка EAS CLI
        run: npm install -g eas-cli

      - name: Сборка IPA (облако Expo)
        working-directory: logos-guide
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform ios --profile preview --non-interactive

  # ---------------------------------------------------------------------------
  # 4. Production AAB для Google Play — при теге v*
  # ---------------------------------------------------------------------------
  build-android-production:
    name: Android AAB (production)
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v') || inputs.platform == 'android' || inputs.platform == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Установка зависимостей
        working-directory: logos-guide
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Установка EAS CLI
        run: npm install -g eas-cli

      - name: Сборка AAB (облако Expo)
        working-directory: logos-guide
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile production --non-interactive

      - name: Отправка в Google Play (если настроен сервисный аккаунт)
        if: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON != '' }}
        working-directory: logos-guide
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas submit --platform android --latest --non-interactive
